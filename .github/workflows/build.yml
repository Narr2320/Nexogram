name: Build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Keys
        run: |
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i 's/APP_ID = [0-9]*;/APP_ID = ${{ secrets.API_ID }};/' $F
          sed -i 's/APP_HASH = "[0-9a-f]*";/APP_HASH = "${{ secrets.API_HASH }}";/' $F
          rm -f TMessagesProj/config/release.keystore
          keytool -genkeypair -keystore TMessagesProj/config/release.keystore -alias key -keyalg RSA -keysize 2048 -validity 10000 -storepass nexopass2026 -keypass nexopass2026 -dname "CN=Narek"
      - name: Build
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease -PRELEASE_STORE_PASSWORD=nexopass2026 -PRELEASE_KEY_ALIAS=key -PRELEASE_KEY_PASSWORD=nexopass2026
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
